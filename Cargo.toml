[package]
name = "sigmaos-filesystem"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Virtual filesystem abstraction"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-filesystem"
readme = "README.md"
keywords = ["filesystem", "vfs", "storage"]
categories = ["filesystem"]

[dependencies]
toml = "0.8"
thiserror = "1.0"
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
